# Konfigurasi Simulasi API Tambora. Ubah di sini, bukan di kode.

[aoi]
epsg = 32750                 # UTM 50S
west = 584000
south = 9068000
east = 632000
north = 9106000
res = 10                     # meter, sejajar grid Sentinel-2
latitude = -8

[kalibrasi]
fmd = "kalibrasi/tambora_savana_cepat20.fmd"   # savana K1-K4 hasil kalibrasi (fmd20)
fms = "kalibrasi/tambora_latihan.fms"
# Koreksi laju api per kode fuel (ROS x faktor). Dari pemodelan terbalik 2 Nov 2026 (33 kejadian
# yang terlihat >= 2 lintasan satelit), diterapkan atas persetujuan Deo 3 Nov 2026 (WITA).
# K1 (30) tetap 1 karena datanya kurang. Hutan TU1 (161) x3,13 dari kelas "lain" (78% TU1).
# Nilai yang sama untuk FlamMap desktop: kalibrasi/tambora_ros_adjust.adj (ROS Adjust File).
ros_adjust = { 31 = 0.77, 32 = 0.69, 33 = 1.33, 161 = 3.13 }
# Koreksi ronde 2 (permintaan Deo 3 Nov 2026), sedang diuji di pemodelan terbalik saja: kalibrasi 13 kejadian tanpa api
# Piong 9 Sep memberi K3 x0,529 (selang 90% 0,41-0,77) dan kelas lain (TU1 61%, TL6 35%) x1,787 (1,14-1,91) terhadap
# koreksi di atas; K2 x0,96 (mencakup 1) dan K4 (data kurang) tetap. Dipindah ke ros_adjust bila uji >= 7 kejadian lain lolos.
ros_adjust_uji = { 31 = 0.77, 32 = 0.365, 33 = 1.33, 161 = 5.59, 186 = 1.79 }

# Catatan lapangan intervensi pemadaman. Kejadian yang cocok tetap dihitung (titik asal, jam mulai), tetapi tidak
# dipakai untuk kalibrasi laju api karena arah dan lajunya dibelokkan regu pemadam. Cocok bila ada titik panasnya
# pada tanggal dari..sampai (WITA) dan <= radius_km dari lat/lon, atau langsung dengan kejadian = "<id>".
[[pemadaman]]
dari = "2026-09-09"
sampai = "2026-09-15"
lat = -8.2585                 # titik panas VIIRS pertama di Piong
lon = 118.1506
radius_km = 3
catatan = "Ada pemadaman (catatan Deo, 3 Nov 2026): 10 Sep api yang seharusnya menyebar ke samping kiri dari arah datangnya dipadamkan, sehingga api merambat naik ke bukit Doro Tabe Nae."

[drive]
# ID folder induk di Google Drive (bagian terakhir URL folder). Bisa juga diisi lewat secret GDRIVE_FOLDER_ID.
folder_id = ""
dasar = "dasar"                    # GeoTIFF dasar (topografi, kanopi, fuel awal kemarau)
landscape = "landscape"            # hasil mingguan: landscape/terbaru dan landscape/arsip/<tanggal>
simulasi = "simulasi"              # hasil simulasi dari GitHub Actions
delineasi = "delineasi"            # SHP delineasi manual areal terbakar (diunggah tiap 5 hari), dibaca workflow areal-terbakar

[dasar]
# Nama file GeoTIFF dasar di folder Drive 'dasar' (sama dengan isi geotiff_junijuli2026_10m.zip)
elev = "elevasi_m.tif"
slope = "lereng_derajat.tif"
aspect = "aspek_derajat.tif"
fuel = "fuel_model.tif"
cover = "tutupan_kanopi_persen.tif"
height = "tinggi_kanopi_m_x10.tif"
cbh = "cbh_m_x10.tif"
cbd = "cbd_kgm3_x100.tif"
s2_median = "s2_median_junijuli_2026_B2B3B4B8B11B12.tif"  # untuk NBR pra-kebakaran
nbr = "nbr_dasar_x10000.tif"                               # dibuat otomatis dari s2_median bila belum ada

[mingguan]
stac = "planetary"            # "planetary" (Microsoft Planetary Computer) atau "earthsearch" (AWS)
hari = 21                     # panjang jendela citra tetap sejak awal musim (1 Jun, 22 Jun, 13 Jul, ...)
awan_maks = 70                # % awan per citra
mode_kelas = "dasar"          # "dasar": K1-K4 tetap dari awal kemarau, hanya bekas terbakar diperbarui
                              # "batas": K1-K4 dihitung ulang dari NDVI terbaru dengan batas tetap di bawah
                              # "kuantil": K1-K4 dari kuantil NDVI terbaru dengan proporsi tetap di bawah
batas_ndvi = [0.317, 0.593, 0.781]
proporsi = [0.033, 0.430, 0.418, 0.118]
dnbr_ambang = 0.08            # petak bekas terbakar tumbuh ke piksel dengan dNBR terkoreksi > ambang ini
dnbr_benih = 0.15             # ... asalkan petak memuat piksel rumput dengan dNBR terkoreksi > dnbr_benih
koreksi_blok_km = 1.5         # koreksi pengeringan musiman = median dNBR lokal per blok ini
hotspot_buffer_m = 750        # dengan FIRMS_MAP_KEY: petak harus berjarak <= ini dari titik panas VIIRS/MODIS
perlu_konfirmasi = true       # tanpa FIRMS_MAP_KEY: kandidat baru dihitung bekas terbakar bila jendela berikutnya masih gelap
konfirmasi_faktor = 0.7       # ... yaitu dNBR terkoreksi > 0,7 x dnbr_ambang dibanding NBR pra-kebakaran
                              # bekas_terbakar_musim.tif: 1 = bekas terbakar, 2 = kandidat (belum fuel 99)
pengamatan_min = 2            # minimal pengamatan cerah per piksel dalam jendela
validasi_bekas = "contoh/piong_9sep/bekas_terbakar_9sep2026_dNBR.shp"  # cek di log: berapa % bekas 9 Sep tertandai
ndvi_rumput_min = 0.0         # piksel batu/pasir dengan NDVI dasar >= 0,2 sudah dihitung rumput di peta dasar
kode_terbakar = 99            # fuel untuk bekas terbakar musim ini (99 = NB9, tidak terbakar lagi)
awal_musim = "06-01"          # bekas terbakar diakumulasi sejak tanggal ini setiap tahun
luas_min_ha = 1.0             # abaikan petak bekas terbakar lebih kecil dari ini

[simulasi]
angin = "otomatis"            # "otomatis" (WindNinja bila ada, kalau tidak model medan), "medan", "windninja", "seragam"
windninja_mesh = 100          # m
burn_period = [0, 24]
zona = "WITA"
model_cuaca = "best_match"

[kawasan]
resort = "docs/data/batas_resort.geojson"   # statistik sisa K1-K4 per resort di dashboard (poligon WGS84)
tn = "docs/data/batas_tn.geojson"           # batas kawasan untuk luas areal terbakar di dalam kawasan
zona_luar_tn_m = 1500                        # pemodelan terbalik: kejadian di luar TN hanya dihitung bila titik panas atau
                                             # areal terbakarnya <= 1,5 km dari batas TN (permintaan Deo, 3 Nov 2026)

[delineasi]
# Delineasi manual areal terbakar di folder Drive 'delineasi' -> docs/status/areal_terbakar.json dan peta_terbakar.html
mode = "gabung"               # "gabung": semua delineasi sejak awal musim digabung; file boleh kumulatif atau hanya areal baru
                              # "terbaru": file tanggal terakhir dianggap seluruh areal terbakar musim ini (koreksi ikut terpakai)
awal_musim = "02-20"          # awal musim kebakaran (kebakaran pertama 2026 tercatat 20 Feb); delineasi sebelum tanggal ini diabaikan
luas_min_ha = 0.01            # potongan poligon lebih kecil dari ini tidak digambar di peta
