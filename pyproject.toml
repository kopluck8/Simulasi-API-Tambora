[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamborafire"
version = "0.1.0"
description = "Simulasi rambatan api savana TN Tambora (MTT/FARSITE-like, Rothermel, angin medan, update landscape Sentinel-2)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "numba>=0.59",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "shapely>=2.0",
  "pyshp>=2.3",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
serviceaccount = ["cryptography>=41"]
dev = ["pytest>=8"]

[project.scripts]
tambora = "tamborafire.cli:main"

[tool.setuptools]
packages = ["tamborafire"]
