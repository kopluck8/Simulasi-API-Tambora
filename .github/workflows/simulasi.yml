name: Simulasi api
run-name: "Simulasi ${{ inputs.mode }} ${{ inputs.titik }} [${{ inputs.id }}]"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "farsite (cuaca per jam) atau mtt (angin tetap)"
        type: choice
        options: [farsite, mtt]
        default: farsite
      titik:
        description: "Titik api 'lintang,bujur' (mis. -8.2585,118.1506)"
        required: true
        default: "-8.2585,118.1506"
      mulai:
        description: "FARSITE: waktu mulai WITA 'YYYY-MM-DD HH:MM'"
        required: false
        default: "2026-09-09 13:00"
      lama_jam:
        description: "Lama simulasi (jam)"
        default: "24"
      angin:
        description: "Angin 20-ft 'km/j,arah asal' (MTT wajib, mis. 20,70; FARSITE kosong = dari cuaca per jam)"
        required: false
        default: ""
      tajuk:
        description: "Metode api tajuk (Crown Fire Calculation Method)"
        type: choice
        options: [finney, scott, tanpa]
        default: finney
      radius_km:
        description: "Analysis Area (km dari titik api)"
        default: "8"
      res:
        description: "Resolusi hitung (m): 10 = detail, 30 = cepat"
        default: "10"
      landscape:
        description: "drive = landscape terbaru di Google Drive; contoh = landscape Piong 30 m di repo"
        type: choice
        options: [drive, contoh]
        default: drive
      id:
        description: "ID permintaan (diisi otomatis oleh halaman peta; boleh kosong)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  simulasi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_TOKEN_URL: ${{ secrets.GDRIVE_TOKEN_URL }}
      GDRIVE_KUNCI: ${{ secrets.GDRIVE_KUNCI }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      ID: ${{ inputs.id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[serviceaccount]"
      - name: Ambil landscape
        id: ls
        run: |
          if [ "${{ inputs.landscape }}" = "drive" ]; then
            python -m tamborafire ambil-landscape --out kerja/terbaru
            echo "lcp=kerja/terbaru/landscape_terbaru_10m.lcp" >> "$GITHUB_OUTPUT"
          else
            echo "lcp=contoh/piong_9sep/landscape_prakebakaran_9sep_30m.lcp" >> "$GITHUB_OUTPUT"
          fi
      - name: Jalankan
        env:
          TITIK: ${{ inputs.titik }}
          MULAI: ${{ inputs.mulai }}
          LAMA: ${{ inputs.lama_jam }}
          ANGIN: ${{ inputs.angin }}
          RADIUS: ${{ inputs.radius_km }}
          RES: ${{ inputs.res }}
        run: |
          OUT="kerja/simulasi/$(date -u +%Y%m%d_%H%M)_${{ inputs.mode }}_$ID"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ARGS="--lcp ${{ steps.ls.outputs.lcp }} --latlon=$TITIK --buffer 30 --radius-km $RADIUS --res $RES --tajuk ${{ inputs.tajuk }} --web --out $OUT"
          KEC=""; ARAH=""
          if [ -n "$ANGIN" ]; then KEC="${ANGIN%%,*}"; ARAH="${ANGIN##*,}"; fi
          if [ "${{ inputs.mode }}" = "mtt" ]; then
            [ -n "$KEC" ] || { echo "MTT perlu angin 'km/j,arah'"; exit 1; }
            MENIT=$(python -c "print(float('$LAMA')*60)")
            python -m tamborafire mtt $ARGS --kecepatan "$KEC" --arah "$ARAH" --menit "$MENIT"
          else
            EXTRA=""
            [ -n "$KEC" ] && EXTRA="--kecepatan $KEC --arah $ARAH"
            python -m tamborafire farsite $ARGS --mulai "$MULAI" --jam "$LAMA" $EXTRA
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: simulasi-${{ github.run_number }}
          path: ${{ env.OUT }}
      - name: Terbitkan hasil untuk halaman peta (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IN_MODE: ${{ inputs.mode }}
          IN_TITIK: ${{ inputs.titik }}
          IN_MULAI: ${{ inputs.mulai }}
          IN_LAMA: ${{ inputs.lama_jam }}
          IN_ANGIN: ${{ inputs.angin }}
          IN_TAJUK: ${{ inputs.tajuk }}
          IN_LS: ${{ inputs.landscape }}
          IN_RES: ${{ inputs.res }}
        run: |
          python - <<'PY'
          import json, os
          e = os.environ
          out = e["OUT"]
          d = json.load(open(os.path.join(out, "web.json")))
          d["run"] = e["RUN_URL"]
          d["masukan"] = {k: e["IN_" + k.upper()] for k in ("mode", "titik", "mulai", "lama", "angin", "tajuk", "ls", "res")}
          open(os.path.join(out, "catatan.md"), "w").write("```json\n" + json.dumps(d, default=str) + "\n```\n")
          PY
          gh release create "sim-$ID" --prerelease --title "Simulasi $IN_MODE $IN_TITIK ($ID)" \
            --notes-file "$OUT/catatan.md" "$OUT/overlay.png" "$OUT/peta_waktu_tiba.png" "$OUT/hasil.zip" "$OUT/web.json"
      - name: Simpan ke Google Drive
        if: env.GDRIVE_FOLDER_ID != ''
        run: python -m tamborafire unggah "$OUT" --ke "simulasi/$(basename $OUT)"
