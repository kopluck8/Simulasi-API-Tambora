name: Update landscape (tiap citra Sentinel-2 baru)

# Dicek 2x sehari (11:00 dan 19:00 WITA). Landscape hanya dihitung bila katalog Sentinel-2 punya citra baru
# sejak update terakhir, jadi praktis setiap 2-5 hari sesuai lintasan Sentinel-2A/2B/2C.
# Jalankan manual dari tab Actions untuk memaksa update tanpa menunggu citra baru.
on:
  schedule:
    - cron: "0 3,11 * * *"
  workflow_dispatch:
    inputs:
      tanggal:
        description: "Tanggal update (YYYY-MM-DD), kosong = hari ini"
        required: false
      mulai_ulang:
        description: "Hitung ulang bekas terbakar sejak awal musim (abaikan status lama)"
        type: boolean
        default: false
      tanpa_unggah:
        description: "Uji saja: jangan unggah ke Drive / jangan ubah status"
        type: boolean
        default: false
      diagnostik:
        description: "Simpan komposit tiap jendela ke cabang 'diagnostik' (untuk penyetelan)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-landscape
  cancel-in-progress: false

jobs:
  cek:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      baru: ${{ steps.cek.outputs.baru }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Cek citra Sentinel-2 baru
        id: cek
        run: python -m tamborafire cek-citra --status docs/status/landscape_terbaru.json

  update:
    needs: cek
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.cek.outputs.baru == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_TOKEN_URL: ${{ secrets.GDRIVE_TOKEN_URL }}
      GDRIVE_KUNCI: ${{ secrets.GDRIVE_KUNCI }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[serviceaccount]"
      - name: Simpan cache data dasar
        uses: actions/cache@v4
        with:
          path: kerja/dasar
          key: dasar-${{ hashFiles('config/tambora.toml') }}
      - name: Update landscape
        run: |
          python -m tamborafire update-landscape --kerja kerja --status docs/status/landscape_terbaru.json \
            ${{ inputs.tanggal && format('--tanggal {0}', inputs.tanggal) || '' }} \
            ${{ inputs.mulai_ulang && '--mulai-ulang' || '' }} ${{ inputs.tanpa_unggah && '--tanpa-unggah' || '' }} \
            ${{ inputs.diagnostik && '--simpan-komposit kerja/diagnostik' || '' }}
      - name: Simpan diagnostik ke cabang diagnostik
        if: ${{ inputs.diagnostik }}
        run: |
          cp kerja/hasil/ringkasan.json kerja/hasil/pratinjau_fuel.png kerja/diagnostik/
          cd kerja/diagnostik
          git init -q -b diagnostik
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Diagnostik $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostik
      - uses: actions/upload-artifact@v4
        with:
          name: landscape-${{ github.run_number }}
          path: |
            kerja/hasil/ringkasan.json
            kerja/hasil/pratinjau_fuel.png
            kerja/hasil/fuel_model.tif
            kerja/hasil/bekas_terbakar_musim.tif
          retention-days: 15
      - name: Catat status di repo
        if: ${{ !inputs.tanpa_unggah }}
        run: |
          cp kerja/hasil/pratinjau_fuel.png docs/status/pratinjau_fuel.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status/
          git diff --cached --quiet || git commit -m "Update landscape $(date -u +%F)"
          git pull --rebase -q origin main && git push
